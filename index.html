<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso à Pokédex</title>
    <link rel="stylesheet" href="/CSS/style.css"> <!--conecta no css do login-->
</head>
<body>

    <div class="caixa-login">
        <h2>Bem-vindo de volta</h2>
        <p class="subtitulo">Faça login para ler sobre o Umbreon!</p>

        <form id="formLogin">
            <div class="campo">
                <label for="usuario">Nome de Usuário:</label>
                <input type="text" id="usuario" placeholder="Ex: Ash Ketchum" required>
            </div>

            <div class="campo">
                <label for="senha">Senha de Acesso:</label>
                <input type="password" id="senha" required>
            </div>

            <button type="submit" id="btnEntrar">Entrar na Pokédex</button>
        </form>
    </div>

    <script src="/JS/script.js"></script> <!--conecta no script-->
</body>
</html>
